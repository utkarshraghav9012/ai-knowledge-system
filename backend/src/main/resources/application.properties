```properties
# =========================================================
# PostgreSQL Database Configuration
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/ai_knowledge_db
spring.datasource.username=postgres
spring.datasource.password=901231
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA / Hibernate Configuration
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =========================================================
# Spring Security Logging
# =========================================================

logging.level.org.springframework.security=TRACE

# =========================================================
# File Upload Configuration
# =========================================================

file.upload-dir=uploads

file.pdf-max-size=104857600
file.image-max-size=20971520
file.audio-max-size=209715200
file.video-max-size=524288000

# =========================================================
# Multipart Upload Configuration
# =========================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.resolve-lazily=true

# =========================================================
# Gemini AI Configuration
# Backup AI provider
# =========================================================

gemini.api.key=YOUR_GEMINI_API_KEY
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# =========================================================
# Ollama Configuration
# =========================================================

ollama.url=http://localhost:11434/api/chat

# Primary local AI model
ollama.model.primary=qwen3-local

# Fallback model
# Currently using the same installed model.
# Change this later when another Ollama model is installed.
ollama.model.fallback=qwen3-local
```
